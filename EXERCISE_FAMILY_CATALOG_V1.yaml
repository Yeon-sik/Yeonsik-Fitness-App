contractVersion: 1
status: APPROVED_FOR_IMPLEMENTATION
sourceBaseline:
  repository: Yeon-sik/Yeonsik-Fitness-App
  branch: feat/fitness-image-3d-pipeline
  baselineCatalog: Fitness_Weight.json
  baselineExerciseCount: 340
  note: This contract defines exercise identity boundaries. Codex must implement it, not redesign it.
authority:
  normative: true
  rules:
  - Family assignment and approved additions in this file are product decisions.
  - Codex MUST NOT merge, split, rename, add, delete, or reassign families/presets on its own.
  - Every existing Fitness_Weight.json exercise ID must match exactly one legacy family rule.
  - If any legacy ID matches zero or more than one family, STOP and report the exact IDs. Do not infer.
  - Unknown variant details remain null/legacy metadata; do not guess from anatomy or exercise-name semantics beyond deterministic
    token rules below.
identityModel:
  family: Exploration/category/family-statistics identity.
  preset: User-facing selectable detailed exercise name. Search aliases may point to the same preset.
  variant: Structured configuration behind a preset; family + variant identifies the performed exercise form.
  loadState: Set-level resistance state. Never part of family identity.
  set: Actual reps/time/weight/assistance values.
  displayRule: Routine/workout/history rows display the detailed preset name, not only the family name.
loadStates:
- bodyweight
- external_load
- added_weight
- assisted
- band_assisted
- band_resisted
loadStateRules:
  bodyweightAddedWeightZeroAllowed: true
  derivationForLegacyRows:
  - whenExactId: back_machine_assisted_pull_up
    loadState: assisted
  - whenExactId: arms_machine_assisted_dip
    loadState: assisted
  - whenExactId: back_band_assisted_pull_up
    loadState: band_assisted
  - whenExactId: chest_bodyweight_weighted_push_up
    loadState: added_weight
  - whenEquipment: band
    loadState: band_resisted
  - whenEquipment: bodyweight
    loadState: bodyweight
  - otherwise: external_load
  notes:
  - Do not convert band assistance/resistance into a fake constant kg value.
  - For bodyweight-capable exercises, a set may change load state between sets.
metricProfiles:
- reps
- weight_reps
- time
- weight_time
performanceStats:
  familyStats:
  - frequency
  - sets
  - reps
  - preset_or_variant_distribution
  - lastPerformedAt
  prRule: PR/e1RM/weight comparison only within a comparable performance key; never blindly compare barbell vs dumbbell vs
    machine variants.
  performanceKey: familyId + canonicalVariantKey + relevantLoadSemantics
imageIdentity:
  target: familyId + visualVariantKey -> illustrationKey -> A/B images
  fallbackOrder:
  - exact_visual_variant
  - family_default
  - placeholder
  rule: Load-state changes such as +10kg vs +20kg do not create separate illustration identity.
variantTokenRules:
  principle: These are deterministic normalization tokens, not family-boundary rules.
  tokens:
    flat:
      angle: flat
    incline:
      angle: incline
    decline:
      angle: decline
    wide_grip:
      gripWidth: wide
    neutral_grip:
      gripOrientation: neutral
    reverse_grip:
      gripOrientation: supinated
    close_grip:
      gripWidth: narrow
    single_arm:
      laterality: unilateral
    one_arm:
      laterality: unilateral
    single_leg:
      laterality: unilateral
    seated:
      position: seated
    standing:
      position: standing
    lying:
      position: lying
    prone:
      position: prone
    kneeling:
      position: kneeling
    chest_supported:
      support: chest_supported
    high_bar:
      barPosition: high_bar
    low_bar:
      barPosition: low_bar
    front_squat:
      barPosition: front
    zercher:
      barPosition: zercher
    sumo:
      stance: sumo
    walking_lunge:
      travelMode: walking
    reverse_lunge:
      direction: reverse
    bulgarian:
      rearFootElevation: elevated
    pause:
      technique: pause
    pendlay:
      technique: pendlay
    yates:
      technique: yates
    kroc:
      technique: kroc
    arnold:
      technique: arnold
    bradford:
      technique: bradford
    behind_neck:
      technique: behind_neck
    bottoms_up:
      technique: bottoms_up
legacyPresetPolicy:
  default: Each legacy exercise row becomes one preset inside its assigned family, preserving its current Korean/English detailed
    name.
  canonicalPresetId: Use the existing legacy exercise ID as migration key; a separate stable presetId may be introduced, but
    legacyExerciseId must remain addressable.
  doNotFlattenDisplay: true
canonicalAliasMerges:
- canonicalPresetId: dumbbell_pullover
  legacyIds:
  - chest_dumbbell_pullover
  - back_dumbbell_pullover
  nameKo: 덤벨 풀오버
  familyId: pullover
  reason: Same physical exercise duplicated by body-part ownership.
- canonicalPresetId: machine_chest_fly
  legacyIds:
  - chest_machine_pec_deck_fly
  - chest_machine_chest_fly
  nameKo: 머신 체스트 플라이
  familyId: chest_fly
  aliases:
  - 펙덱 플라이
  reason: Treat naming difference as alias, not separate identity.
- canonicalPresetId: machine_rear_delt_fly
  legacyIds:
  - shoulders_machine_reverse_pec_deck
  - shoulders_machine_rear_delt_fly
  nameKo: 머신 리어 델트 플라이
  familyId: rear_delt_fly
  aliases:
  - 리버스 펙덱
  reason: Same reverse-fly machine task.
- canonicalPresetId: dumbbell_rear_delt_fly
  legacyIds:
  - shoulders_dumbbell_rear_delt_fly
  - shoulders_dumbbell_bent_over_lateral_raise
  nameKo: 덤벨 리어 델트 플라이
  familyId: rear_delt_fly
  aliases:
  - 벤트오버 덤벨 레터럴 레이즈
  reason: Same rear-delt fly task; alternate familiar name remains searchable.
searchPresetAliases:
- alias: 중량 푸쉬업
  familyId: push_up
  targetPreset: chest_bodyweight_push_up
  defaultLoadState: added_weight
  legacyId: chest_bodyweight_weighted_push_up
  rule: Alias/preset shortcut only; not a distinct exercise identity.
- alias: 중량 풀업
  familyId: pull_up
  targetPreset: back_bodyweight_pull_up
  defaultLoadState: added_weight
  rule: Search shortcut; not a distinct exercise identity.
- alias: 중량 친업
  familyId: pull_up
  targetPreset: back_bodyweight_chin_up
  defaultLoadState: added_weight
families:
  push_up:
    nameKo: 푸쉬업
    nameEn: Push-Up
    defaultUiPart: chest
    legacyMatch:
      regex:
      - ^chest_(?:bodyweight|band)_(?:.+_)?push_up$
      - ^arms_bodyweight_(?:diamond|close_grip)_push_up$
    allowedVariantDimensions:
    - support
    - handWidth
    - bodyAngle
    - equipment
    - laterality
    - technique
    allowedLoadStates:
    - bodyweight
    - added_weight
    - band_resisted
    notes: Weighted push-up is not a separate identity; added weight is set-level load state.
  dip:
    nameKo: 딥스
    nameEn: Dip
    defaultUiPart: chest
    legacyMatch:
      exact:
      - chest_bodyweight_chest_dip
      - arms_bodyweight_dip
      - arms_machine_assisted_dip
    allowedVariantDimensions:
    - equipment
    - support
    - torsoAngle
    - emphasis
    - assistanceMethod
    allowedLoadStates:
    - bodyweight
    - added_weight
    - assisted
    - band_assisted
    notes: Parallel-bar chest/triceps emphasis stays inside one family. Bench dip stays separate.
  bench_press:
    nameKo: 벤치 프레스
    nameEn: Bench Press
    defaultUiPart: chest
    legacyMatch:
      exact:
      - arms_barbell_close_grip_bench_press
      regex:
      - ^chest_(?:dumbbell|barbell|smith)_(?:bench_press|.+_bench_press|neutral_grip_press|single_arm_incline_press|floor_press|guillotine_press)$
    allowedVariantDimensions:
    - equipment
    - angle
    - gripOrientation
    - gripWidth
    - laterality
    - technique
    - support
    allowedLoadStates:
    - external_load
    notes: Free-weight/Smith supine bench-press lineage. Machine/cable/band chest press is a separate chest_press family.
  chest_press:
    nameKo: 체스트 프레스
    nameEn: Chest Press
    defaultUiPart: chest
    legacyMatch:
      exact:
      - chest_machine_chest_press
      - chest_band_chest_press
      regex:
      - ^chest_machine_.+(?:chest_press|incline_press)$
      - ^chest_cable_.+chest_press$
    allowedVariantDimensions:
    - equipment
    - angle
    - laterality
    - support
    - machineType
    - handle
    allowedLoadStates:
    - external_load
    - band_resisted
  chest_fly:
    nameKo: 체스트 플라이
    nameEn: Chest Fly
    defaultUiPart: chest
