name: KMP release readiness

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kmp-release-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-kmp:
    name: Android and shared gates
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node.js for generated exercise catalogs
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Reject tracked credentials and signing material
        shell: bash
        run: |
          set -euo pipefail
          blocked_files="$(git ls-files | grep -E '(^|/)(local\.properties|\.env($|\.))|(\.(jks|keystore|p12|pfx|pem|key))$' | grep -Ev '(^|/)\.env\.example$' || true)"
          if [[ -n "$blocked_files" ]]; then
            echo "::error::Tracked local credentials or signing material are forbidden:"
            printf '%s\n' "$blocked_files"
            exit 1
          fi
          if git grep -nI -E -- 'AKIA[0-9A-Z]{16}|-----BEGIN( [A-Z0-9]+)* PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk_(live|test)_[A-Za-z0-9]+'; then
            echo "::error::Potential credential literal found in a tracked text file."
            exit 1
          fi

      - name: Run shared and Android verification gates
        run: |
          bash -n scripts/cloud/setup.sh scripts/cloud/verify.sh
          bash scripts/cloud/setup.sh
          bash scripts/cloud/verify.sh

      - name: Keep Android and shared test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fitness-android-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.html
            shared/build/reports/tests/
          if-no-files-found: ignore

  android-instrumented:
    name: Android core instrumentation (emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node.js for generated exercise catalogs
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Build app and test APKs before the emulator boots
        run: >-
          ./gradlew --no-daemon --max-workers=2 --console=plain
          :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The suite deletes app data, so it only ever runs on this disposable emulator.
      - name: Run core instrumentation suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/cloud/instrumented-core.sh

      - name: Keep instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fitness-android-instrumentation-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore

  ios-host:
    name: iOS framework and Swift host gates
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK for shared common tests
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: List available simulator devices
        run: xcrun simctl list devices available

      - name: Compile and test shared iOS simulator code
        run: >-
          ./gradlew --no-daemon
          :shared:testAndroid
          :shared:compileKotlinIosSimulatorArm64
          :shared:compileTestKotlinIosSimulatorArm64
          :shared:iosSimulatorArm64Test
          :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Verify Xcode project and build the SwiftUI host
        run: |
          xcodebuild -list -project iosApp/iosApp.xcodeproj
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme YeonsikIosProof \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
