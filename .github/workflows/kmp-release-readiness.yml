name: KMP release readiness

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kmp-release-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-kmp:
    name: Android and shared gates
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node.js for generated exercise catalogs
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Reject tracked credentials and signing material
        shell: bash
        run: |
          set -euo pipefail
          blocked_files="$(git ls-files | grep -E '(^|/)(local\.properties|\.env($|\.))|(\.(jks|keystore|p12|pfx|pem|key))$' | grep -Ev '(^|/)\.env\.example$' || true)"
          if [[ -n "$blocked_files" ]]; then
            echo "::error::Tracked local credentials or signing material are forbidden:"
            printf '%s\n' "$blocked_files"
            exit 1
          fi
          if git grep -nI -E -- 'AKIA[0-9A-Z]{16}|-----BEGIN( [A-Z0-9]+)* PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk_(live|test)_[A-Za-z0-9]+'; then
            echo "::error::Potential credential literal found in a tracked text file."
            exit 1
          fi

      - name: Run shared and Android verification gates
        run: |
          bash -n scripts/cloud/setup.sh scripts/cloud/verify.sh
          bash scripts/cloud/setup.sh
          bash scripts/cloud/verify.sh

      - name: Keep Android and shared test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fitness-android-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.html
            shared/build/reports/tests/
          if-no-files-found: ignore

  android-instrumented:
    name: Android core instrumentation (emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node.js for generated exercise catalogs
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Build app and test APKs before the emulator boots
        run: >-
          ./gradlew --no-daemon --max-workers=2 --console=plain
          :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Verify instrumentation result gate
        run: python3 -m unittest discover -s scripts/cloud -p 'test_*.py'

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The suite deletes app data, so it only ever runs on this disposable emulator.
      - name: Run core instrumentation suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/cloud/instrumented-core.sh

      - name: Keep instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fitness-android-instrumentation-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore

      - name: Keep the synthetic Room record
        uses: actions/upload-artifact@v4
        with:
          name: ordinary-workout-android
          path: build/parity/android.json
          if-no-files-found: error
          overwrite: true

  ios-host:
    name: iPhone IPA and iOS simulator gates
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # Kotlin/Native Release LTO links Compose into the static iPhone framework.
      GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx5g -Dorg.gradle.workers.max=2'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK for shared common tests
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: List available simulator devices
        run: xcrun simctl list devices available

      - name: Compile and test shared iOS simulator code
        run: >-
          ./gradlew --no-daemon
          :shared:testAndroid
          :shared:compileKotlinIosSimulatorArm64
          :shared:compileTestKotlinIosSimulatorArm64
          :shared:iosSimulatorArm64Test

      - name: Run workout and shared body UI, relaunch and reinstall checks
        run: bash scripts/ios/test-workout-simulator.sh

      - name: Keep the synthetic iOS record
        uses: actions/upload-artifact@v4
        with:
          name: ordinary-workout-ios
          path: build/ios-sideload/ios.json
          if-no-files-found: error
          overwrite: true

      - name: Build unsigned iPhone IPA
        if: github.event_name != 'pull_request'
        run: bash scripts/ios/package-device-ipa.sh

      - name: Upload unsigned iPhone IPA
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: fitness-ios-unsigned-ipa
          path: |
            build/ios-sideload/Yeonsik-Fitness-unsigned.ipa
            build/ios-sideload/Yeonsik-Fitness-unsigned.ipa.sha256
          if-no-files-found: error
          overwrite: true
          retention-days: 14

      - name: Keep simulator test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fitness-ios-simulator-failure
          path: build/ios-sideload/WorkoutSmoke-*.xcresult
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

  workout-parity:
    name: Compare completed Android and iOS records
    needs: [android-instrumented, ios-host]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: ordinary-workout-*
          path: build/parity
          merge-multiple: true
      - run: python3 scripts/cloud/compare-ordinary-workout.py build/parity/android.json build/parity/ios.json
