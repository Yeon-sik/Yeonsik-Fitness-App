name: PR121 drop superseded lookup

on:
  push:
    branches:
      - feat/restore-dining-components

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Revert superseded store lookup and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "integration-bot"
          git config user.email "integration-bot@users.noreply.github.com"
          git revert --no-commit 1a3bc52670e6113a6d099384e3f4221dbf7dd0ed
          git rm .github/workflows/pr121-merge-diagnostic.yml
          git commit -m "chore: drop superseded dining store lookup"
          git push origin HEAD:feat/restore-dining-components
