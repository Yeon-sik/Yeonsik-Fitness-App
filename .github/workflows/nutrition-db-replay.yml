name: Nutrition disposable DB replay

on:
  pull_request:
    paths:
      - 'supabase/nutrition/supabase/migrations/**'
      - 'supabase/nutrition/integration/**'
      - 'contracts/fitness-external-reference.v1.json'
      - '.github/workflows/nutrition-db-replay.yml'
  push:
    branches:
      - main
    paths:
      - 'supabase/nutrition/supabase/migrations/**'
      - 'supabase/nutrition/integration/**'
      - 'contracts/fitness-external-reference.v1.json'
      - '.github/workflows/nutrition-db-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    name: Historical and fresh Nutrition replay
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: supabase/nutrition/integration/package-lock.json

      - name: Install integration dependencies
        run: npm ci --prefix supabase/nutrition/integration --no-audit --no-fund

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3.0.1
        with:
          version: latest

      - name: Replay historical and final schemas in disposable local projects
        run: node supabase/nutrition/integration/historical-replay/replay.mjs
