apply plugin: "com.android.application"

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream -> localProperties.load(stream) }
}

def dotenvValues = [:]
def dotenvFile = rootProject.file("supabase/.env")
if (dotenvFile.exists()) {
    dotenvFile.eachLine { line ->
        def matcher = line =~ /^\s*([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*?)\s*$/
        if (matcher.matches()) {
            String value = matcher.group(2)
            if ((value.startsWith('"') && value.endsWith('"'))
                    || (value.startsWith("'") && value.endsWith("'"))) {
                value = value.substring(1, value.length() - 1)
            }
            dotenvValues[matcher.group(1)] = value
        }
    }
}

def dotenvValue = { String key -> dotenvValues.get(key) ?: "" }

def configValue = { String propertyKey, String environmentKey, String viteEnvironmentKey, String dotenvKey ->
    localProperties.getProperty(propertyKey)
            ?: System.getenv(environmentKey)
            ?: System.getenv(viteEnvironmentKey)
            ?: dotenvValue(dotenvKey)
            ?: ""
}

def buildConfigString = { String value ->
    '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

// The shared/original DB is build-managed; Nutrition DB remains a separately
// persisted Settings connection so its URL/key can be changed without rebuilding.
def supabaseUrl = configValue(
        "SUPABASE_URL",
        "SUPABASE_URL",
        "VITE_SUPABASE_URL",
        "ORIGINAL_DB_URL"
)
def supabaseAnonKey = configValue(
        "SUPABASE_ANON_KEY",
        "SUPABASE_ANON_KEY",
        "VITE_SUPABASE_ANON_KEY",
        "ORIGINAL_DB_ANON"
)

def exerciseMasterAssetsDir = file("$buildDir/generated/exercise-master-assets")

tasks.register("copyExerciseMasterAssets", Copy) {
    from(rootProject.file("Fitness_Index.json"))
    from(rootProject.file("Fitness_Weight.json"))
    into(exerciseMasterAssetsDir)
}

android {
    namespace "com.yeonsik.fitnessapp"
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "com.yeonsik.fitnessapp"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
        buildConfigField "String", "SUPABASE_URL", buildConfigString(supabaseUrl)
        buildConfigField "String", "SUPABASE_ANON_KEY", buildConfigString(supabaseAnonKey)
    }

    signingConfigs {
        release {
            def storePath = System.getenv("FITNESS_RELEASE_STORE_FILE")
            if (storePath) {
                storeFile file(storePath)
                storePassword System.getenv("FITNESS_RELEASE_STORE_PASSWORD")
                keyAlias System.getenv("FITNESS_RELEASE_KEY_ALIAS")
                keyPassword System.getenv("FITNESS_RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.release
        }
    }

    sourceSets {
        main {
            assets.srcDir(exerciseMasterAssetsDir)
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

tasks.register("verifyReleaseConfiguration") {
    doLast {
        [
                "FITNESS_RELEASE_STORE_FILE",
                "FITNESS_RELEASE_STORE_PASSWORD",
                "FITNESS_RELEASE_KEY_ALIAS",
                "FITNESS_RELEASE_KEY_PASSWORD"
        ].each { key ->
            if (!System.getenv(key)) {
                throw new GradleException("Missing required release environment variable: ${key}")
            }
        }
    }

}

dependencies {
    implementation "com.google.android.gms:play-services-location:21.4.0"
    testImplementation "junit:junit:4.13.2"
}

tasks.matching { it.name in ["bundleRelease", "assembleRelease"] }.configureEach {
    dependsOn("verifyReleaseConfiguration")
}

tasks.named("preBuild").configure {
    dependsOn("copyExerciseMasterAssets")
}
