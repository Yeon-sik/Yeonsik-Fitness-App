apply plugin: "com.android.application"

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream -> localProperties.load(stream) }
}

def dotenvValues = [:]
def dotenvFile = rootProject.file("supabase/.env")
if (dotenvFile.exists()) {
    dotenvFile.eachLine { line ->
        def matcher = line =~ /^\s*([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*?)\s*$/
        if (matcher.matches()) {
            String value = matcher.group(2)
            if ((value.startsWith('"') && value.endsWith('"'))
                    || (value.startsWith("'") && value.endsWith("'"))) {
                value = value.substring(1, value.length() - 1)
            }
            dotenvValues[matcher.group(1)] = value
        }
    }
}

def dotenvValue = { String... keys ->
    for (String key : keys) {
        String value = dotenvValues.get(key)
        if (value) {
            return value
        }
    }
    return ""
}

def buildConfigString = { String value ->
    '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

// Personal records use the shared Personal OS project. Nutrition catalog data
// uses an independent FitnessApp-only Supabase project and session.
def supabaseUrl = localProperties.getProperty("SUPABASE_URL")
        ?: System.getenv("SUPABASE_URL")
        ?: System.getenv("VITE_SUPABASE_URL")
        ?: dotenvValue("SUPABASE_URL", "VITE_SUPABASE_URL", "ORIGINAL_DB_URL")
        ?: ""
def supabaseAnonKey = localProperties.getProperty("SUPABASE_ANON_KEY")
        ?: System.getenv("SUPABASE_ANON_KEY")
        ?: System.getenv("VITE_SUPABASE_ANON_KEY")
        ?: dotenvValue("SUPABASE_ANON_KEY", "VITE_SUPABASE_ANON_KEY", "ORIGINAL_DB_ANON")
        ?: ""
def nutritionSupabaseUrl = localProperties.getProperty("NUTRITION_SUPABASE_URL")
        ?: System.getenv("NUTRITION_SUPABASE_URL")
        ?: dotenvValue("NUTRITION_SUPABASE_URL", "NUTRITION_DB_URL")
        ?: ""
def nutritionSupabaseAnonKey = localProperties.getProperty("NUTRITION_SUPABASE_ANON_KEY")
        ?: System.getenv("NUTRITION_SUPABASE_ANON_KEY")
        ?: dotenvValue(
                "NUTRITION_SUPABASE_ANON_KEY",
                "NUTRITION_DB_ANON_KEY",
                "NUTRITION_DB_ANON"
        )
        ?: ""
def priceTraceSupabaseUrl = localProperties.getProperty("PRICETRACE_SUPABASE_URL")
        ?: System.getenv("PRICETRACE_SUPABASE_URL")
        ?: dotenvValue("PRICETRACE_SUPABASE_URL", "PRICETRACE_DB_URL")
        ?: ""
def priceTraceSupabaseAnonKey = localProperties.getProperty("PRICETRACE_SUPABASE_ANON_KEY")
        ?: System.getenv("PRICETRACE_SUPABASE_ANON_KEY")
        ?: dotenvValue(
                "PRICETRACE_SUPABASE_ANON_KEY",
                "PRICETRACE_DB_ANON_KEY",
                "PRICETRACE_DB_ANON"
        )
        ?: ""

def exerciseMasterAssetsDir = file("$buildDir/generated/exercise-master-assets")

tasks.register("copyExerciseMasterAssets", Copy) {
    from(rootProject.file("Fitness_Index.json"))
    from(rootProject.file("Fitness_Weight.json"))
    into(exerciseMasterAssetsDir)
}

android {
    namespace "com.yeonsik.fitnessapp"
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "com.yeonsik.fitnessapp"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
        buildConfigField "String", "SUPABASE_URL", buildConfigString(supabaseUrl)
        buildConfigField "String", "SUPABASE_ANON_KEY", buildConfigString(supabaseAnonKey)
        buildConfigField "String", "NUTRITION_SUPABASE_URL", buildConfigString(nutritionSupabaseUrl)
        buildConfigField "String", "NUTRITION_SUPABASE_ANON_KEY", buildConfigString(nutritionSupabaseAnonKey)
        buildConfigField "String", "PRICETRACE_SUPABASE_URL", buildConfigString(priceTraceSupabaseUrl)
        buildConfigField "String", "PRICETRACE_SUPABASE_ANON_KEY", buildConfigString(priceTraceSupabaseAnonKey)
    }

    signingConfigs {
        release {
            def storePath = System.getenv("FITNESS_RELEASE_STORE_FILE")
            if (storePath) {
                storeFile file(storePath)
                storePassword System.getenv("FITNESS_RELEASE_STORE_PASSWORD")
                keyAlias System.getenv("FITNESS_RELEASE_KEY_ALIAS")
                keyPassword System.getenv("FITNESS_RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.release
        }
    }

    sourceSets {
        main {
            assets.srcDir(exerciseMasterAssetsDir)
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

tasks.register("verifyReleaseConfiguration") {
    doLast {
        [
                "FITNESS_RELEASE_STORE_FILE",
                "FITNESS_RELEASE_STORE_PASSWORD",
                "FITNESS_RELEASE_KEY_ALIAS",
                "FITNESS_RELEASE_KEY_PASSWORD"
        ].each { key ->
            if (!System.getenv(key)) {
                throw new GradleException("Missing required release environment variable: ${key}")
            }
        }
    }

}

dependencies {
    implementation "com.google.android.gms:play-services-location:21.4.0"
    testImplementation "junit:junit:4.13.2"
}

tasks.matching { it.name in ["bundleRelease", "assembleRelease"] }.configureEach {
    dependsOn("verifyReleaseConfiguration")
}

tasks.named("preBuild").configure {
    dependsOn("copyExerciseMasterAssets")
}
